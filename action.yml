name: 'Maximize build disk space'
description: 'Remove most software from stock image, keep container tooling (free 20GB -> 50GB)'
branding:
  icon: 'crop'
  color: 'blue'
inputs:
  extra-squeeze:
    description: 'Extra 6GB but ~2 min slower'
    required: false
    default: 'false'
runs:
  using: "composite"
  steps:
    - name: Disk space report before modification
      shell: bash
      run: |
          echo "==> Available space before cleanup"
          df -h
          # Remove swapfile (3gb)
          # swapoff is required for arm, but not for x64?
          sudo swapoff -a || true; sudo rm -f /swapfile || true
          # Remove toolchains, browsers
          shopt -s nullglob
          EXTRAPKG=""
          if [ "${{ inputs.extra-squeeze }}" = "true" ]; then
            # These have a lot of small files and are a bit slower to remove
            EXTRAPKG="/usr/share/miniconda /opt/hostedtoolcache"
          fi
          printf '%s\0' /opt/PyPy /opt/az /opt/node/ /opt/pipx /opt/go /opt/Ruby \
              /usr/lib/llvm-* /usr/local/julia* /usr/local/lib/android /usr/share/dotnet \
              /usr/share/swift /usr/local/.ghcup /usr/lib/firefox /opt/google/chrome \
              /opt/microsoft/msedge $EXTRAPKG \
              | sudo xargs -0 -n1 -P4 rm -rf
          echo "==> Available space after cleanup"
          df -h